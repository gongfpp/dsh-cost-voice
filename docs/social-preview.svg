<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101C33"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="0.55" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#BCC8D6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="238" cy="322" r="320" fill="url(#glow)"/>

  <!-- 图标：大肥鱼吃白米饭，4 倍放大 -->
  <g transform="translate(112 176) scale(4)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M14.8 26.5C9.4 23.6 4.6 18 2.4 11.8c6.6 2.8 11.8 7.4 14.2 12.2z" fill="url(#fin)"/>
    <path d="M14.8 30.5C9.4 33.4 4.6 39 2.4 45.2c6.6-2.8 11.8-7.4 14.2-12.2z" fill="url(#fin)"/>
    <path d="M21 13.6C24.4 6.6 32.6 5.2 37 12.2c-5.4-1.8-11-1.2-16 1.4z" fill="url(#fin)"/>
    <path d="M45.2 26.6c0-9.7-8.1-15.8-17.6-15.8S10 16.9 10 26.6s8.1 15.8 17.6 15.8 17.6-6.1 17.6-15.8z" fill="url(#fish)"/>
    <path d="M15.6 33c3.2 5.5 9.9 8.6 17 8.6-4.4 3.4-11.4 3.4-15.4.2-3-2.4-4.4-5.6-1.6-8.8z" fill="#FFEDD5" opacity="0.8"/>
    <path d="M28.6 29.6c4.4 2.8 4.8 8.8-1.2 10-2.2-3.4-1.8-7 1.2-10z" fill="#FB923C" opacity="0.92"/>
    <path d="M42.4 26.8c3.6.2 4.4 4.2.2 5.4-1.4-1.6-1.5-3.4-.2-5.4z" fill="#9A3412"/>
    <circle cx="37.4" cy="21.6" r="5.6" fill="#FFFFFF"/>
    <circle cx="39" cy="22" r="2.8" fill="#1F2937"/>
    <circle cx="40.2" cy="20.3" r="1.1" fill="#FFFFFF"/>
  </g>
  <g transform="translate(112 176) scale(4)">
    <path d="M38.2 46.4c1.6-9.4 15.6-9.8 18 0z" fill="#FFFFFF" stroke="#E4EAF1" stroke-width="0.8"/>
    <g fill="#E2E8F0">
      <ellipse cx="43.6" cy="42.4" rx="1.5" ry="1.1"/>
      <ellipse cx="48.6" cy="40.6" rx="1.5" ry="1.1"/>
      <ellipse cx="53.4" cy="42.6" rx="1.5" ry="1.1"/>
      <ellipse cx="47.4" cy="44.6" rx="1.5" ry="1.1"/>
    </g>
    <path d="M36.8 45.8h21.8c-.6 6.9-4.6 11.4-10.9 11.4S37.4 52.7 36.8 45.8z" fill="url(#bowl)"/>
    <rect x="35.7" y="45" width="24" height="3.4" rx="1.7" fill="#DFE6EF"/>
    <path d="M41 55.6h13.6" stroke="#94A3B8" stroke-width="2.1" stroke-linecap="round" opacity="0.5"/>
  </g>
  <g transform="translate(112 176) scale(4)">
    <g fill="#FFFFFF" opacity="0.95">
