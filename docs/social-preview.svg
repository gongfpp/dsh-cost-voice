<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',system-ui,sans-serif" role="img" aria-label="每轮扣款语音播报 · dsh-cost-voice">
  <title>每轮扣款语音播报 · dsh-cost-voice</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101C33"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4D6BFE" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="240" cy="320" r="330" fill="url(#glow)"/>

  <!-- 图标：大肥鱼吃白米饭（来自 icon.svg，4 倍放大） -->
  <g transform="translate(112 176) scale(4)">
<defs>
    <linearGradient id="whale" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8FA8FF"/>
      <stop offset="0.5" stop-color="#556DFB"/>
      <stop offset="1" stop-color="#3B4FE0"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E86FD"/>
      <stop offset="1" stop-color="#3B4FE0"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#C7D2DE"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M45.6 26.8c0-9.8-8.2-16-17.8-16S10 17 10 26.8s8.2 16 17.8 16 17.8-6.2 17.8-16z"/>
    </clipPath>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- 尾鳍 -->
    <path d="M15.5 24.5C9.5 21.5 4.5 16 2 9.6c6.8 2.6 12.4 7.4 15 12.4z" fill="url(#fin)"/>
    <path d="M15.5 31C9.5 34 4.5 39.5 2 45.9c6.8-2.6 12.4-7.4 15-12.4z" fill="url(#fin)"/>
    <!-- 背鳍 -->
    <path d="M22.5 13.4C25.8 6.8 33.2 5.4 37.4 12.2c-5.6-1.8-11-1.2-14.9 1.2z" fill="url(#fin)"/>
    <!-- 鲸身 -->
    <path d="M45.6 26.8c0-9.8-8.2-16-17.8-16S10 17 10 26.8s8.2 16 17.8 16 17.8-6.2 17.8-16z" fill="url(#whale)"/>
    <!-- 白肚皮（裁在身体里） -->
    <ellipse cx="26.5" cy="40.5" rx="16" ry="8" fill="#E8EDFF" opacity="0.95" clip-path="url(#bodyClip)"/>
    <!-- 侧鳍 -->
    <path d="M28.6 30.2c4.4 2.8 4.8 9-1.2 10.2-2.3-3.5-1.9-7.2 1.2-10.2z" fill="#6E86FD" opacity="0.95"/>
    <!-- 腮红 -->
    <ellipse cx="32.2" cy="31.4" rx="2.7" ry="1.8" fill="#FF9DB6" opacity="0.6"/>
    <!-- 张开的嘴（吃白饭） -->
    <path d="M45.8 23.6 38.6 27.6l6.9 4.4c2.3-3.1 2.4-5.7.3-8.4z" fill="#26304F"/>
    <!-- 眼睛 -->
    <circle cx="37.6" cy="21.4" r="5.7" fill="#FFFFFF"/>
    <circle cx="39.2" cy="21.8" r="2.9" fill="#1B2340"/>
    <circle cx="40.4" cy="20" r="1.2" fill="#FFFFFF"/>
  </g>
  <!-- 喷出的水花 -->
  <g stroke="#8FA8FF" stroke-width="2.4" stroke-linecap="round" opacity="0.95">
    <path d="M24.8 9.4c-.5-2.6.2-4.4 1.4-5.6"/>
    <path d="M29.4 9.2c.3-2.8 1.6-4.6 3.2-5.6"/>
  </g>
  <!-- 白米饭与碗 -->
  <g>
    <path d="M38.6 46.4c1.2-11 16-11.4 18.1 0z" fill="#FFFFFF" stroke="#E4EAF1" stroke-width="0.8"/>
    <g fill="#E2E8F0">
      <ellipse cx="43.8" cy="41.8" rx="1.5" ry="1.1"/>
      <ellipse cx="48.8" cy="39.8" rx="1.5" ry="1.1"/>
      <ellipse cx="53.4" cy="42" rx="1.5" ry="1.1"/>
      <ellipse cx="47.6" cy="43.8" rx="1.5" ry="1.1"/>
    </g>
    <path d="M36.8 45.8h21.8c-.6 6.9-4.6 11.4-10.9 11.4S37.4 52.7 36.8 45.8z" fill="url(#bowl)"/>
    <rect x="35.7" y="45" width="24" height="3.4" rx="1.7" fill="#DFE6EF"/>
    <path d="M41 55.6h13.6" stroke="#94A3B8" stroke-width="2.1" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- 掉落的两粒米 -->
  <g fill="#FFFFFF" opacity="0.95">
    <circle cx="43.8" cy="34" r="1.5"/>
    <circle cx="47" cy="37.4" r="1.3"/>
  </g>
  <!-- 筷子 -->
  <g stroke="#B45309" stroke-width="2.4" stroke-linecap="round" opacity="0.95">
    <path d="M60.6 8.6 50.4 38.6"/>
    <path d="M63.6 12.6 54 39.8"/>
  </g>
  </g>

  <!-- 文字 -->
  <text x="470" y="250" font-size="64" font-weight="700" fill="#F8FAFC">每轮扣款语音播报</text>
  <text x="470" y="310" font-size="30" fill="#94A3B8">dsh-cost-voice · DeepSeek Harness 插件</text>
  <text x="470" y="392" font-size="34" fill="#E2E8F0">每轮会话结束，支付宝到账。</text>
  <text x="470" y="440" font-size="34" fill="#E2E8F0">本轮花了多少，用声音告诉你。</text>

  <!-- 标签 -->
  <g font-size="24" fill="#CBD5F5">
    <rect x="470" y="492" width="188" height="52" rx="26" fill="#1E293B" stroke="#334155"/>
    <text x="564" y="526" text-anchor="middle">支付宝音色</text>
    <rect x="678" y="492" width="188" height="52" rx="26" fill="#1E293B" stroke="#334155"/>
    <text x="772" y="526" text-anchor="middle">大白饭音色</text>
    <rect x="886" y="492" width="248" height="52" rx="26" fill="#1E293B" stroke="#334155"/>
    <text x="1010" y="526" text-anchor="middle">音频内置 · 不联网</text>
  </g>

  <!-- 声波装饰 -->
  <g stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <line x1="1160" y1="268" x2="1160" y2="372"/>
    <line x1="1190" y1="232" x2="1190" y2="408"/>
    <line x1="1220" y1="288" x2="1220" y2="352"/>
    <line x1="1250" y1="252" x2="1250" y2="388"/>
  </g>
</svg>
